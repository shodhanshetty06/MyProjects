worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Compress text-based responses (API JSON, JS/CSS bundles) before they
    # hit the wire — the frontend's dev-server bundle and the API's JSON
    # payloads (workspace aggregation, search results) are otherwise sent
    # uncompressed through this proxy.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml
        font/woff2;

    # Single public entry point for the whole platform: frontend, API,
    # docs, and the matching websocket all live behind this one port so
    # there is exactly one URL to remember — http://localhost:5000.
    server {
        listen 5000;
        server_name localhost;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Upgrade headers are required for the matching module's
            # /api/v1/matching/ws websocket; harmless for plain HTTP calls.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Upgrade headers are required for Vite's HMR websocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
