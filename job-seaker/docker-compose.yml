x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  PROJECT_NAME: ${PROJECT_NAME:-AI Job Search Platform}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:5000"]}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobplatform}:${POSTGRES_PASSWORD:-jobplatform}@postgres:5432/${POSTGRES_DB:-jobplatform}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-job-platform-storage}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  VECTOR_DIMENSIONS: ${VECTOR_DIMENSIONS:-1024}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3.5}
  RESUME_MAX_UPLOAD_MB: ${RESUME_MAX_UPLOAD_MB:-10}
  ATS_KEYWORD_SCORE_WEIGHT: ${ATS_KEYWORD_SCORE_WEIGHT:-0.6}
  ATS_STRUCTURE_SCORE_WEIGHT: ${ATS_STRUCTURE_SCORE_WEIGHT:-0.4}
  JOB_INGESTION_SWEEP_INTERVAL_MINUTES: ${JOB_INGESTION_SWEEP_INTERVAL_MINUTES:-360}
  JOB_INGESTION_STALE_CRAWL_HOURS: ${JOB_INGESTION_STALE_CRAWL_HOURS:-24}
  JOB_INGESTION_HTTP_TIMEOUT_SECONDS: ${JOB_INGESTION_HTTP_TIMEOUT_SECONDS:-30}
  JOB_INGESTION_MAX_JOBS_PER_RUN: ${JOB_INGESTION_MAX_JOBS_PER_RUN:-500}
  JOB_INGESTION_USER_AGENT: ${JOB_INGESTION_USER_AGENT:-JobPlatformBot/1.0 (+https://jobplatform.example.com)}
  SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-90}
  SEARCH_AUTOCOMPLETE_CACHE_TTL_SECONDS: ${SEARCH_AUTOCOMPLETE_CACHE_TTL_SECONDS:-600}
  SEARCH_TRENDING_CACHE_TTL_SECONDS: ${SEARCH_TRENDING_CACHE_TTL_SECONDS:-1800}
  SEARCH_AUTOCOMPLETE_MIN_CHARS: ${SEARCH_AUTOCOMPLETE_MIN_CHARS:-2}
  SEARCH_KEYWORD_CANDIDATE_LIMIT: ${SEARCH_KEYWORD_CANDIDATE_LIMIT:-150}
  SEARCH_SEMANTIC_CANDIDATE_LIMIT: ${SEARCH_SEMANTIC_CANDIDATE_LIMIT:-150}
  SEARCH_HYBRID_KEYWORD_WEIGHT: ${SEARCH_HYBRID_KEYWORD_WEIGHT:-0.4}
  SEARCH_HYBRID_SEMANTIC_WEIGHT: ${SEARCH_HYBRID_SEMANTIC_WEIGHT:-0.6}
  SEARCH_TRENDING_WINDOW_DAYS: ${SEARCH_TRENDING_WINDOW_DAYS:-30}
  SEARCH_TRGM_SIMILARITY_THRESHOLD: ${SEARCH_TRGM_SIMILARITY_THRESHOLD:-0.3}
  SEARCH_EXPERIENCE_LEVEL_HEURISTIC_ENABLED: ${SEARCH_EXPERIENCE_LEVEL_HEURISTIC_ENABLED:-true}
  MATCHING_SEMANTIC_WEIGHT: ${MATCHING_SEMANTIC_WEIGHT:-0.6}
  MATCHING_SKILL_WEIGHT: ${MATCHING_SKILL_WEIGHT:-0.4}
  MATCHING_BOOST_COUNTRY: ${MATCHING_BOOST_COUNTRY:-6.0}
  MATCHING_BOOST_EXPERIENCE: ${MATCHING_BOOST_EXPERIENCE:-6.0}
  MATCHING_BOOST_WORK_MODE: ${MATCHING_BOOST_WORK_MODE:-4.0}
  MATCHING_BOOST_SALARY: ${MATCHING_BOOST_SALARY:-6.0}
  MATCHING_BOOST_EMPLOYMENT_TYPE: ${MATCHING_BOOST_EMPLOYMENT_TYPE:-3.0}
  MATCHING_CANDIDATE_LIMIT: ${MATCHING_CANDIDATE_LIMIT:-100}
  MATCHING_RECOMMENDATION_JOB_LIMIT: ${MATCHING_RECOMMENDATION_JOB_LIMIT:-20}
  MATCHING_RECOMMENDATION_COMPANY_LIMIT: ${MATCHING_RECOMMENDATION_COMPANY_LIMIT:-10}
  MATCHING_RECOMMENDATION_SKILL_LIMIT: ${MATCHING_RECOMMENDATION_SKILL_LIMIT:-10}
  MATCHING_RECOMMENDATION_REFRESH_INTERVAL_MINUTES: ${MATCHING_RECOMMENDATION_REFRESH_INTERVAL_MINUTES:-1440}
  MATCHING_STALE_MATCH_HOURS: ${MATCHING_STALE_MATCH_HOURS:-72}
  AUTO_APPLY_MAX_ATTEMPTS: ${AUTO_APPLY_MAX_ATTEMPTS:-3}
  AUTO_APPLY_BROWSER_TIMEOUT_MS: ${AUTO_APPLY_BROWSER_TIMEOUT_MS:-30000}
  AUTO_APPLY_CONFIRMATION_WAIT_MS: ${AUTO_APPLY_CONFIRMATION_WAIT_MS:-2000}
  AUTO_APPLY_WORKDAY_MAX_STEPS: ${AUTO_APPLY_WORKDAY_MAX_STEPS:-6}
  GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
  GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
  GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-http://localhost:5000/api/v1/email-tracking/gmail/callback}
  GMAIL_OAUTH_SCOPES: ${GMAIL_OAUTH_SCOPES:-https://www.googleapis.com/auth/gmail.readonly}
  GMAIL_OAUTH_SUCCESS_REDIRECT_URL: ${GMAIL_OAUTH_SUCCESS_REDIRECT_URL:-}
  GMAIL_OAUTH_FAILURE_REDIRECT_URL: ${GMAIL_OAUTH_FAILURE_REDIRECT_URL:-}
  GMAIL_OAUTH_STATE_TTL_SECONDS: ${GMAIL_OAUTH_STATE_TTL_SECONDS:-600}
  GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
  GMAIL_SYNC_INTERVAL_MINUTES: ${GMAIL_SYNC_INTERVAL_MINUTES:-10}
  GMAIL_MAX_MESSAGES_PER_SYNC: ${GMAIL_MAX_MESSAGES_PER_SYNC:-50}
  GMAIL_API_TIMEOUT_SECONDS: ${GMAIL_API_TIMEOUT_SECONDS:-20}
  EMAIL_TRACKING_CLASSIFICATION_CONFIDENCE_THRESHOLD: ${EMAIL_TRACKING_CLASSIFICATION_CONFIDENCE_THRESHOLD:-0.6}
  EMAIL_TRACKING_MATCH_CONFIDENCE_THRESHOLD: ${EMAIL_TRACKING_MATCH_CONFIDENCE_THRESHOLD:-0.72}
  EMAIL_TRACKING_MATCH_MARGIN: ${EMAIL_TRACKING_MATCH_MARGIN:-0.15}
  EMAIL_TRACKING_MATCH_LOW_SCORE_FLOOR: ${EMAIL_TRACKING_MATCH_LOW_SCORE_FLOOR:-0.3}
  EMAIL_TRACKING_MATCH_LOOKBACK_DAYS: ${EMAIL_TRACKING_MATCH_LOOKBACK_DAYS:-180}
  EMAIL_TRACKING_COMPANY_MATCH_WEIGHT: ${EMAIL_TRACKING_COMPANY_MATCH_WEIGHT:-0.7}
  EMAIL_TRACKING_TITLE_MATCH_WEIGHT: ${EMAIL_TRACKING_TITLE_MATCH_WEIGHT:-0.3}
  NOTIFICATION_SES_SENDER_EMAIL: ${NOTIFICATION_SES_SENDER_EMAIL:-notifications@jobplatform.example.com}
  NOTIFICATION_SES_CONFIGURATION_SET: ${NOTIFICATION_SES_CONFIGURATION_SET:-}
  NOTIFICATION_DEFAULT_CHANNELS: ${NOTIFICATION_DEFAULT_CHANNELS:-in_app,email}
  NOTIFICATION_MAX_RETRIES: ${NOTIFICATION_MAX_RETRIES:-3}

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: jobplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobplatform}
      POSTGRES_DB: ${POSTGRES_DB:-jobplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobplatform-net

  redis:
    image: redis:7-alpine
    container_name: jobplatform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobplatform-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-parsing:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-parsing
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q parsing,celery --loglevel=info
    environment:
      <<: *backend-env
    # Overrides the image's HTTP healthcheck (built for the `api` service,
    # which this image is shared with) — workers run no web server, so a
    # celery-native ping is used instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-embedding:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-embedding
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q embedding --loglevel=info
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-ingestion
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q ingestion,skills,celery --loglevel=info
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-matching:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-matching
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q matching --loglevel=info
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-ats-resume:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-ats-resume
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q ats_optimization,ats_files --loglevel=info
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-auto-apply:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-auto-apply
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q auto_apply --concurrency=2 --loglevel=info
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  worker-email-tracking:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-worker-email-tracking
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q email_tracking,notifications --loglevel=info
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobplatform-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
    # `beat` only schedules tasks (no worker consumer, no HTTP server), so
    # neither the image's HTTP healthcheck nor `celery inspect ping` apply
    # here — disable rather than report a permanently-false "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobplatform-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobplatform-frontend
    restart: unless-stopped
    environment:
      # Relative path — resolved against whatever origin the browser loaded
      # the page from (http://localhost:5000), so it always goes through
      # the nginx proxy below instead of hardcoding a second host:port.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - jobplatform-net

  # Single public entry point. Merges the frontend, the API, and its docs
  # (Swagger/ReDoc under /api/v1/docs, /api/v1/redoc) behind one URL:
  # http://localhost:5000 — nothing else needs to be published to the host.
  nginx:
    image: nginx:alpine
    container_name: jobplatform-nginx
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - jobplatform-net

volumes:
  postgres_data:
  redis_data:

networks:
  jobplatform-net:
    driver: bridge
